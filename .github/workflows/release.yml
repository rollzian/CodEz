name: Debian release
on:
  push:
    branches: [main]
    paths: ['release.env', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: codez-release
  cancel-in-progress: false
jobs:
  debian-amd64:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          source release.env
          go vet ./...
          go test ./...
          go test -race ./...
          python3 -m unittest discover -s cloud
          bash scripts/build-deb.sh
          package="codez#$VBUILD-$VRELEASE.deb"
          test "$(dpkg-deb -f "$package" Package)" = codez
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          test "$(dpkg-deb -f "$package" Version)" = "$VERSION-$VRELEASE"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          dpkg-deb -x "$package" "$work"
          "$work/usr/bin/codez" --version
          python3 scripts/smoke.py "$work/usr/bin/codez"
          python3 scripts/stream-smoke.py "$work/usr/bin/codez"
          python3 scripts/menu-smoke.py "$work/usr/bin/codez"
          python3 scripts/auxia-menu-smoke.py "$work/usr/bin/codez"
          python3 scripts/navigation-smoke.py "$work/usr/bin/codez"
      - name: Publish verified package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source release.env
          tag="$VBUILD-$VRELEASE"
          package="codez#$tag.deb"
          release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            -f name="CodEz #$tag" \
            -f body="Release candidate. Debian amd64 package built and smoke-tested by CI." \
            -F draft=true -F prerelease=true --jq '.id')
          encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$package")
          asset=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$package" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$encoded&label=$encoded")
          test "$(jq -r '.state' <<< "$asset")" = uploaded
          test "$(jq -r '.size' <<< "$asset")" = "$(stat -c %s "$package")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false --jq '.html_url'
