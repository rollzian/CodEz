name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -o codez ./cmd/codez
      - run: python3 scripts/smoke.py ./codez
      - run: python3 scripts/stream-smoke.py ./codez
      - run: bash scripts/build-deb.sh
      - run: |
          source release.env
          sudo dpkg -i "codez#$VBUILD-$VRELEASE.deb"
          test "$(command -v codez)" = /usr/bin/codez
          codez --version
          python3 scripts/smoke.py /usr/bin/codez
          sudo dpkg -r codez
      - uses: actions/upload-artifact@v4
        with:
          name: codez-linux-amd64
          path: |
            codez
            codez*.deb
